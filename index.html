<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi organizador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png" type="image/png">
</head>
<body>

  <div class="app-container">
    <!-- Encabezado / Header -->
    <header class="header">
      <div class="user-greeting">
        <span class="sub-title">ORGANIZADOR PERSONAL</span>
        <h1>Hola, <span id="userNameDisplay">Gabo</span> 🐱</h1>
        <p class="date-display" id="currentDateDisplay">Hoy es viernes, 2 de octubre.</p>
      </div>
      <div class="progress-box">
        <span class="progress-title">Progreso de hoy</span>
        <div class="progress-count" id="progressText">0 de 0</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>
    </header>

    <!-- Formulario Nueva Tarea -->
    <section class="card form-card">
      <h2>Nueva tarea</h2>
      <form id="taskForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="taskTitle">Tarea</label>
            <input type="text" id="taskTitle" placeholder="Ej. Terminar la tarea de matemáticas" required>
          </div>
          <div class="form-group">
            <label for="taskSubject">Materia</label>
            <select id="taskSubject">
              <option value="Matemáticas">Matemáticas</option>
              <option value="Español">Español</option>
              <option value="Inglés">Inglés</option>
              <option value="Módulo">Módulo</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Fecha</label>
            <input type="date" id="taskDue">
          </div>
          <div class="form-group">
            <label for="taskPriority">Prioridad</label>
            <select id="taskPriority">
              <option value="Baja">Baja</option>
              <option value="Media" selected>Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
          <div class="form-group button-group">
            <button type="submit" class="btn-primary">+ Agregar</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Sección de Lista de Tareas -->
    <section class="card list-card">
      <div class="list-header">
        <div>
          <h2>Mis tareas</h2>
          <span class="task-counter" id="taskCounterText">0 pendientes</span>
        </div>
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">Todas</button>
          <button class="tab-btn" data-filter="pending">Pendientes</button>
          <button class="tab-btn" data-filter="completed">Completadas</button>
        </div>
      </div>

      <ul class="task-list" id="taskList">
        <!-- Las tareas se renderizan dinámicamente aquí -->
      </ul>
    </section>
  </div>

  <!-- SDKs de Firebase (compatiblidad v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>

  <!-- Script Principal -->
  <script src="app.js"></script>
</body>
</html>
